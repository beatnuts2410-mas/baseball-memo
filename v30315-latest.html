<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>野球メモ v3.03.15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#frame{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="frame" title="野球メモ"></iframe><script>
(function(){
 const frame=document.getElementById('frame');
 const parentHref=location.href;
 const patchUrl='v30315-runtime-patch.js';
 function escJs(s){return JSON.stringify(s)}
 async function boot(){
  const html=await (await fetch('index.html',{cache:'no-store'})).text();
  if(!html||!html.includes('(async function bootApp(){'))throw new Error('index.htmlを読み込めませんでした');
  const patch=await (await fetch(patchUrl,{cache:'no-store'})).text();
  const sharePatch=`(function(){
    const parent=${escJs(parentHref)};
    const orig=window.loadSharedMatchFromHash;
    if(typeof orig!=='function')return;
    window.loadSharedMatchFromHash=async function(){
      try{
        const u=new URL(parent),p=new URLSearchParams(u.search);let m4=p.get('m4'),m5=p.get('m5');
        const h=String(u.hash||'').replace(/^#/,'');if(!m4&&!m5&&/^(m4|m5)=/.test(h)){const hp=new URLSearchParams(h);m4=hp.get('m4');m5=hp.get('m5');}
        if(!m4&&!m5)return orig();
        let payload=null,g=null;
        const restore=async(enc,mode)=>{if(!enc)return false;try{const c=await gzipDecodeUrlSafe(enc,mode),cg=c?.g;if(!cg||typeof cg!=='object'||!Array.isArray(cg.h)||cg.h.length<9||!Array.isArray(cg.d))return false;const ex=expandMatchPayload(cg);if(!ex||typeof ex!=='object'||Array.isArray(ex))return false;payload=c;g=ex;return true}catch(e){return false}};
        let ok=await restore(m5,'m5');if(!ok)ok=await restore(m4,'m4');if(!ok)return orig();
        g.shareId=payload.s||g.shareId;g.sharedTeamName=String(payload.g?.tn||payload.tn||'共有元チーム').trim()||'共有元チーム';sharedGame=g;sharedSourceUrl=parent;tab='data';resultGameId=null;render();return true;
      }catch(e){console.error('v30315 share bridge',e);return orig();}
    };
  })();`;
  const marker='(async function bootApp(){';
  frame.srcdoc=html.replace(marker,sharePatch+'\n'+patch+'\n'+marker);
 }
 boot().catch(e=>{document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap">起動エラー\n'+String(e.stack||e)+'</pre>'});
})();
</script></body></html>
