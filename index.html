<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>野球メモ v3.03.16 搬送監査テスト</title><style>body{font-family:system-ui,sans-serif;padding:20px;line-height:1.6}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px}.ok{font-weight:700}</style></head><body><h1>野球メモ v3.03.16 搬送監査テスト</h1><div id="out">検証中…</div><script>(async()=>{const out=document.getElementById('out');try{const base=new URL('https://raw.githubusercontent.com/beatnuts2410-mas/baseball-memo/main/');const files=Array.from({length:45},(_,i)=>'chunk-'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(files.map(async f=>{const r=await fetch(new URL(f,base),{cache:'no-store'});if(!r.ok)throw Error(f+' '+r.status);return r.text()}));const bin=atob(parts.join('').trim()),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ab=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();const html=new TextDecoder().decode(ab);const ok=html.includes('(async function bootApp(){');out.innerHTML='<p class="ok">45チャンク取得・gzip復元：成功</p><p>復元サイズ：'+ab.byteLength.toLocaleString()+' bytes</p><p>bootApp()検出：'+(ok?'成功':'失敗')+'</p><pre>これは本番アプリではなく、搬送経路だけを検証する安全なテストブランチです。main / Cloudflare Pages は変更していません。</pre>';}catch(e){out.innerHTML='<p>検証失敗</p><pre>'+String(e.stack||e)+'</pre>';}})();</script></body></html>
