name: transport-audit-test

on:
  workflow_dispatch:
  push:
    branches:
      - test/v3.03.16-transport

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Build deterministic 45-chunk payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, base64, hashlib
          blocks=[]
          for i in range(52500):
              blocks.append(hashlib.sha256(f'transport-audit-v3.03.16-{i}'.encode()).digest())
          payload = b'TRANSPORT-AUDIT-v3.03.16\n' + b''.join(blocks)
          with gzip.GzipFile('/tmp/payload.gz', 'wb', mtime=0) as f:
              f.write(payload)
          encoded = base64.b64encode(open('/tmp/payload.gz','rb').read()).decode('ascii')
          print('source_bytes=',len(payload))
          print('gzip_bytes=',len(open('/tmp/payload.gz','rb').read()))
          print('base64_bytes=',len(encoded))
          assert 44 * 50000 < len(encoded) <= 45 * 50000
          open('/tmp/payload.b64','w').write(encoded)
          open('/tmp/source.sha256','w').write(hashlib.sha256(payload).hexdigest()+'\n')
          PY
          rm -rf /tmp/chunks && mkdir /tmp/chunks
          split -b 50000 -d -a 2 /tmp/payload.b64 /tmp/chunks/chunk-
          count=$(find /tmp/chunks -type f | wc -l)
          test "$count" -eq 45
          echo "chunk_count=$count"
      - name: Reassemble and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/chunks/chunk-* > /tmp/reassembled.b64
          cmp /tmp/payload.b64 /tmp/reassembled.b64
          base64 -d /tmp/reassembled.b64 > /tmp/reassembled.gz
          python3 - <<'PY'
          import gzip, hashlib
          actual = gzip.open('/tmp/reassembled.gz','rb').read()
          expected = open('/tmp/source.sha256').read().strip()
          got = hashlib.sha256(actual).hexdigest()
          print('expected_sha256=',expected)
          print('actual_sha256=',got)
          print('reconstructed_bytes=',len(actual))
          assert got == expected
          assert actual.startswith(b'TRANSPORT-AUDIT-v3.03.16')
          PY
          echo 'TRANSPORT_AUDIT_PASS'
      - name: Verify live Cloudflare 45-chunk transport
        shell: bash
        run: |
          set -euo pipefail
          base='https://baseball-memo.pages.dev/'
          rm -rf /tmp/live && mkdir /tmp/live
          curl -fsSL --retry 3 --retry-all-errors "${base}" -o /tmp/live/index.html
          grep -q "Array.from({length:45}" /tmp/live/index.html
          for i in $(seq -w 0 44); do
            curl -fsSL --retry 3 --retry-all-errors "${base}chunk-${i}.txt" -o "/tmp/live/chunk-${i}.txt"
          done
          cat /tmp/live/chunk-*.txt > /tmp/live/reassembled.b64
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          idx=pathlib.Path('/tmp/live/index.html').read_text(encoding='utf-8')
          encoded=pathlib.Path('/tmp/live/reassembled.b64').read_text().strip()
          raw=base64.b64decode(encoded, validate=True)
          html=gzip.decompress(raw)
          digest=hashlib.sha256(html).hexdigest()
          print('live_index_bytes=',len(idx.encode()))
          print('live_base64_bytes=',len(encoded))
          print('live_gzip_bytes=',len(raw))
          print('live_reconstructed_html_bytes=',len(html))
          print('live_reconstructed_sha256=',digest)
          assert len(encoded) > 44*50000
          assert len(encoded) <= 45*50000
          assert b'(async function bootApp(){' in html
          PY
          echo 'LIVE_TRANSPORT_AUDIT_PASS'
